# ==============================================================================
version: "3.8"

services:
  # ----------------------------------------------------------------------------
  # 1. PostgreSQL Relational Database Service (Audit Trail)
  # ----------------------------------------------------------------------------
  db:
    image: postgres:15-alpine
    container_name: visionguard_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-visionguard_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-visionguard_secure_pass_23l0710}
      POSTGRES_DB: ${POSTGRES_DB:-visionguard_db}
    volumes:
      # Named volume for permanent database persistence
      - postgres_data:/var/lib/postgresql/data
    networks:
      - visionguard-net
    # Rubric Requirement: "publishes no port to the outside"
    # Port 5432 is exposed exclusively to the internal Compose network.
    # It CANNOT be accessed directly from host network or outside world.
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-visionguard_user} -d ${POSTGRES_DB:-visionguard_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  # ----------------------------------------------------------------------------
  # 2. VisionGuard Flask Web Application Service
  # ----------------------------------------------------------------------------
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: visionguard-web:latest
    container_name: visionguard_web
    restart: unless-stopped
    environment:
      # Services reach each other by service name ('db') on the internal network
      DATABASE_URL: postgresql://${POSTGRES_USER:-visionguard_user}:${POSTGRES_PASSWORD:-visionguard_secure_pass_23l0710}@db:5432/${POSTGRES_DB:-visionguard_db}
      SECRET_KEY: ${SECRET_KEY:-visionguard-super-secret-key-23l0710}
      MODEL_PATH: ${MODEL_PATH:-models/champion.keras}
      DECISION_THRESHOLD: ${DECISION_THRESHOLD:-0.23}
      INFERENCE_MODE: ${INFERENCE_MODE:-local}
      PORT: 5000
    ports:
      # Publishes port to outside host (avoiding macOS ControlCenter port 5000 clash)
      - "${WEB_PORT:-5001}:5000"
    volumes:
      # Optional read-only mount of models directory
      - ./models:/app/models:ro
    networks:
      - visionguard-net
    # Wait for database readiness health-check before starting web application
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
    name: visionguard_postgres_data

networks:
  visionguard-net:
    name: visionguard_internal_network
    driver: bridge

