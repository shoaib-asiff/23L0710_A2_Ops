name: VisionGuard CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  lint-and-test:
    name: Lint & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8
          pip install -r requirements-docker.txt

      - name: Lint Code with Flake8
        run: |
          # Stop the build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=.venv,archive,warmup_data,evidence
          # Exit-zero treats formatting warnings as warnings without halting build
          flake8 . --count --exit-zero --max-complexity=15 --max-line-length=127 --statistics --exclude=.venv,archive,warmup_data,evidence

      - name: Run VisionGuard Unit Tests
        env:
          DATABASE_URL: sqlite:///visionguard.db
          INFERENCE_MODE: local
          MODEL_PATH: models/champion.keras
        run: |
          python -m unittest tests/test_unit.py

  docker-build:
    name: Build & Verify Docker Image
    runs-on: ubuntu-latest
    needs: lint-and-test

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Container Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: visionguard-web:ci
          load: true

      - name: Container Smoke Test
        run: |
          docker run --rm visionguard-web:ci python -c "import tensorflow as tf; print(f'CI Container Verification: TensorFlow {tf.__version__} OK')"
